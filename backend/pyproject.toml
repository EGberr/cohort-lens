[project]
name = "cohort-lens-backend"
version = "0.1.0"
description = "Cohort Lens backend: agentic RAG over Gen Z consumer research"
authors = [
    { name = "EGberr", email = "157116288+EGberr@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
